[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpcb"
version = "0.1.0.dev0"
description = "Early-stage desktop workspace for PCB fabrication"
readme = "README.md"
authors = [{name = "Monotoba"}]
license = "BSD-2-Clause"
requires-python = ">=3.11,<3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "PySide6>=6.10.1,<6.11",
  "shapely>=2.1.2,<2.3",
  "svgpathtools>=1.7.2,<1.8",
  "Pillow>=12.1.0,<12.2",
  "scikit-image>=0.26.0,<0.27",
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
  "pyserial>=3.5,<4.0",
  "gerbonara>=1.0.0",
  "vpype>=1.10.0,<1.11",
  "attrs>=23,<25",
  "pydantic>=2.6,<3",
  "orjson>=3.9,<4",
  "typing-extensions>=4.8,<4.12",
  "platformdirs>=4,<5",
  "qtpy>=2.4,<3",
]

[project.optional-dependencies]
vectorize = ["potracer>=0.0.1"]
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/Monotoba/OpenPCB"
Documentation = "https://github.com/Monotoba/OpenPCB/tree/main/docs"
Issues = "https://github.com/Monotoba/OpenPCB/issues"
Source = "https://github.com/Monotoba/OpenPCB"

[project.scripts]
openpcb = "openpcb.__main__:main"

[tool.setuptools.packages.find]
include = ["openpcb*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.openpcb]
geom_tolerance_mm = 0.01
max_board_size_mm = [1000.0, 1000.0]
